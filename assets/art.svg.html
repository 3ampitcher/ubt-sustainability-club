<!-- Cute flat illustrations, one per game. Drawn as SVG so they stay sharp
     on any screen, weigh almost nothing, and need no image files. Cards
     reference them with <use href="#art-…">. -->
<svg class="sprite" aria-hidden="true" focusable="false"><defs>

  <linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A8E7F7"/><stop offset="1" stop-color="#1E86B8"/>
  </linearGradient>
  <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#CFEBFB"/><stop offset="1" stop-color="#EEF8FF"/>
  </linearGradient>
  <linearGradient id="gHeat" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFC46B"/><stop offset="1" stop-color="#FF7A5C"/>
  </linearGradient>
  <linearGradient id="gPond" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E8F6FF"/><stop offset="1" stop-color="#9AD1EE"/>
  </linearGradient>
  <linearGradient id="gDrop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FD4F7"/><stop offset="1" stop-color="#2C86C9"/>
  </linearGradient>

  <!-- ── Save the Turtle ── -->
  <radialGradient id="gCaustic" cx=".5" cy="0" r="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".34"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gShell" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#5FBE7E"/><stop offset="1" stop-color="#2C7A4B"/>
  </linearGradient>
  <linearGradient id="gSand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F7E7BE"/><stop offset="1" stop-color="#E0C894"/>
  </linearGradient>
  <symbol id="art-turtle" viewBox="0 0 160 100">
    <rect width="160" height="100" fill="url(#gSea)"/>
    <rect width="160" height="100" fill="url(#gCaustic)"/>
    <g fill="#FFFFFF" opacity=".13">
      <polygon points="24,0 40,0 16,100 -4,100"/>
      <polygon points="72,0 82,0 62,100 48,100"/>
      <polygon points="126,0 138,0 124,100 108,100"/>
    </g>
    <g fill="#FFFFFF" opacity=".45">
      <circle cx="130" cy="22" r="3.6"/><circle cx="139" cy="12" r="2.3"/><circle cx="122" cy="35" r="1.8"/>
      <circle cx="26" cy="30" r="2.6"/><circle cx="33" cy="20" r="1.6"/>
    </g>
    <path d="M0 84 Q30 73 56 82 T110 80 T160 86 L160 100 L0 100Z" fill="url(#gSand)"/>
    <path d="M0 84 Q30 73 56 82 T110 80 T160 86" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity=".45"/>
    <g fill="#2E9E63">
      <path d="M17 90 q-8 -12 -1 -23 q6 9 4 15 q5 -7 9 -9 q-3 11 -9 17z"/>
      <path d="M143 92 q-7 -11 -1 -20 q5 8 3 13 q4 -6 8 -8 q-3 9 -8 15z"/>
    </g>

    <g transform="translate(82 46)">
      <ellipse cx="2" cy="27" rx="31" ry="5" fill="#0E4A63" opacity=".22"/>
      <!-- rear flippers, behind the shell -->
      <path d="M14 12 q14 2 20 10 q-9 3 -17 -1z" fill="#2C7A4B"/>
      <path d="M-14 -14 q-13 -6 -22 -3 q6 8 16 9z" fill="#358F58"/>
      <path d="M26 -2 l12 -6 -2 12z" fill="#2C7A4B"/>
      <!-- shell -->
      <ellipse cx="0" cy="0" rx="28" ry="21" fill="url(#gShell)"/>
      <g stroke="#256B41" stroke-width="1.3" stroke-linejoin="round">
        <path d="M7 0 3.5 6-3.5 6-7 0-3.5-6 3.5-6z" fill="#4FB073" transform="translate(0 1) scale(1.05)"/>
        <path d="M6 0 3 5.2-3 5.2-6 0-3-5.2 3-5.2z" fill="#48A76C" transform="translate(-14 -3)"/>
        <path d="M6 0 3 5.2-3 5.2-6 0-3-5.2 3-5.2z" fill="#48A76C" transform="translate(14 -3)"/>
        <path d="M5.2 0 2.6 4.5-2.6 4.5-5.2 0-2.6-4.5 2.6-4.5z" fill="#3E9B62" transform="translate(-9 13)"/>
        <path d="M5.2 0 2.6 4.5-2.6 4.5-5.2 0-2.6-4.5 2.6-4.5z" fill="#3E9B62" transform="translate(9 13)"/>
        <path d="M5.2 0 2.6 4.5-2.6 4.5-5.2 0-2.6-4.5 2.6-4.5z" fill="#54B87A" transform="translate(0 -13)"/>
      </g>
      <ellipse cx="-8" cy="-10" rx="12" ry="6" fill="#FFFFFF" opacity=".18"/>
      <ellipse cx="0" cy="0" rx="28" ry="21" fill="none" stroke="#1F5E39" stroke-width="2.6"/>
      <!-- front flippers, in front -->
      <path d="M-12 10 q-16 6 -22 16 q12 2 21 -6z" fill="#4CB077"/>
      <path d="M-12 10 q-16 6 -22 16" fill="none" stroke="#2C7A4B" stroke-width="1.6"/>
      <!-- head -->
      <g transform="translate(-33 -4)">
        <circle r="10" fill="#4CB077"/>
        <circle r="10" fill="none" stroke="#2C7A4B" stroke-width="2"/>
        <circle cx="-3.5" cy="-2.5" r="2.2" fill="#10301F"/>
        <circle cx="-2.7" cy="-3.3" r=".8" fill="#FFFFFF"/>
        <path d="M-7 3 q4 3.5 7.5 .5" stroke="#10301F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <circle cx="-6" cy="4.5" r="2.4" fill="#FF9EA8" opacity=".45"/>
      </g>
    </g>
  </symbol>

  <!-- ── Eco Race ── -->
  <symbol id="art-race" viewBox="0 0 160 100">

    <rect y="61" width="160" height="3" fill="#2C3357"/>
    <g fill="#FFFFFF" opacity=".85">
      <rect x="4" y="82" width="16" height="4" rx="2"/><rect x="34" y="82" width="16" height="4" rx="2"/>
      <rect x="64" y="82" width="16" height="4" rx="2"/><rect x="94" y="82" width="16" height="4" rx="2"/>
      <rect x="124" y="82" width="16" height="4" rx="2"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".75">
      <path d="M6 70 h18"/><path d="M2 92 h13"/>
    </g>
    <g transform="translate(92 76)">
      <ellipse cx="-4" cy="13" rx="34" ry="4" fill="#171C33" opacity=".3"/>

      <path d="M-13 -17 q12 -3 22 0 l8 8 h-37z" fill="#CFF3DC"/>
      <path d="M-11 -15 l-5 6 h13 v-6z" fill="#8FD9F5"/>
      <path d="M2 -15 v6 h13 l-6 -6z" fill="#8FD9F5"/>
      <circle cx="26" cy="0" r="3" fill="#FFF3B0"/>
      <circle cx="-19" cy="10" r="7.5" fill="#232942"/><circle cx="-19" cy="10" r="3" fill="#C3CCE0"/>
      <circle cx="21" cy="10" r="7.5" fill="#232942"/><circle cx="21" cy="10" r="3" fill="#C3CCE0"/>
    </g>
  </symbol>

  <!-- ── Bin It ── -->
  <symbol id="art-bin" viewBox="0 0 160 100">
    <rect width="160" height="100" fill="#DFF3DC"/>
    <circle cx="28" cy="26" r="21" fill="#FFFFFF" opacity=".5"/>
    <circle cx="136" cy="72" r="27" fill="#FFFFFF" opacity=".42"/>
    <g transform="translate(80 52)">
      <ellipse cx="0" cy="38" rx="30" ry="5" fill="#2E7A3C" opacity=".2"/>
      <path d="M-25 -12 h50 l-5 47 a5 5 0 0 1 -5 4 h-30 a5 5 0 0 1 -5 -4z" fill="#3EA354"/>
      <path d="M-25 -12 h50 l-1.6 14 h-46.8z" fill="#51BE68"/>
      <rect x="-29" y="-21" width="58" height="9" rx="4.5" fill="#2E8B47"/>
      <rect x="-7" y="-27" width="14" height="7" rx="3.5" fill="#2E8B47"/>
      <g fill="#FFFFFF" transform="translate(0 16)">
        <g><path d="M-9 6 h11 v-3.5 l7.5 6 -7.5 6 V11 h-11z"/></g>
        <g transform="rotate(120)"><path d="M-9 6 h11 v-3.5 l7.5 6 -7.5 6 V11 h-11z"/></g>
        <g transform="rotate(240)"><path d="M-9 6 h11 v-3.5 l7.5 6 -7.5 6 V11 h-11z"/></g>
      </g>
    </g>
  </symbol>

  <!-- ── Don't Cook the Planet ── -->
  <symbol id="art-earth" viewBox="0 0 160 100">
    <rect width="160" height="100" fill="url(#gHeat)"/>
    <circle cx="136" cy="16" r="15" fill="#FFEDA6" opacity=".9"/>
    <g stroke="#FFFFFF" stroke-width="2.6" fill="none" opacity=".38" stroke-linecap="round">
      <path d="M12 24 q6 -6 12 0 t12 0"/><path d="M8 36 q6 -6 12 0 t12 0"/>
    </g>
    <g transform="translate(78 58)">
      <circle r="31" fill="#43ABE2"/>
      <path d="M-23 -13 q11 -8 19 -2 q9 6 2 13 q-9 6 -17 0 q-8 -7 -4 -11z" fill="#54C471"/>
      <path d="M5 8 q13 -6 19 2 q4 9 -6 13 q-13 4 -17 -4 q-2 -7 4 -11z" fill="#54C471"/>
      <path d="M-17 15 q9 -4 13 2 q2 7 -6 8 q-9 1 -9 -5z" fill="#54C471"/>

      <circle cx="-10" cy="-3" r="2.6" fill="#12303F"/>
      <circle cx="10" cy="-3" r="2.6" fill="#12303F"/>
      <path d="M-7 12 q7 -6 14 0" stroke="#12303F" stroke-width="2.3" fill="none" stroke-linecap="round"/>
    </g>
    <path d="M106 38 q5 7 0 10 a5 5 0 0 1 0 -10z" fill="#A6E4FF"/>
  </symbol>

  <!-- ── Drop Catch ── -->
  <symbol id="art-drop" viewBox="0 0 160 100">
    <rect width="160" height="100" fill="url(#gPond)"/>
    <g fill="#4FA8D8" opacity=".4">
      <path d="M34 20 q6 9 0 13 a6.5 6.5 0 0 1 0 -13z"/>
      <path d="M128 30 q5 7 0 10 a5 5 0 0 1 0 -10z"/>
    </g>
    <g transform="translate(80 42)">
      <path d="M0 -25 q19 23 19 33 a19 19 0 0 1 -38 0 q0 -10 19 -33z" fill="url(#gDrop)"/>
      <ellipse cx="-7" cy="11" rx="4" ry="6.5" fill="#FFFFFF" opacity=".55"/>
      <circle cx="-6" cy="-1" r="2.2" fill="#FFFFFF" opacity=".7"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-width="2.6" opacity=".8">
      <ellipse cx="80" cy="86" rx="17" ry="5"/>
      <ellipse cx="80" cy="86" rx="31" ry="9" opacity=".55"/>
    </g>
    <path d="M0 92 q20 -6 40 0 t40 0 t40 0 t40 0 L160 100 L0 100Z" fill="#63B6E2" opacity=".55"/>
  </symbol>

  <!-- ── Power UBT ── -->
  <symbol id="art-power" viewBox="0 0 160 100">
    <rect width="160" height="100" fill="url(#gSky)"/>
    <circle cx="28" cy="20" r="12" fill="#FFD84D"/>
    <g stroke="#FFD84D" stroke-width="2.6" stroke-linecap="round" opacity=".85">
      <path d="M28 3 v-0.5"/><path d="M14 8 l-1 -1"/><path d="M42 8 l1 -1"/>
    </g>
    <rect x="88" y="26" width="56" height="54" rx="4" fill="#F4F7FB"/>
    <rect x="88" y="26" width="56" height="11" rx="4" fill="#1E2A5E"/>
    <g fill="#BBD3E8">

      <rect x="96" y="60" width="11" height="9" rx="2"/><rect x="112" y="60" width="11" height="9" rx="2"/><rect x="128" y="60" width="9" height="9" rx="2"/>
    </g>
    <rect y="80" width="160" height="20" fill="#8FD48E"/>
    <g><rect x="70" y="70" width="4" height="11" fill="#7A5230"/><circle cx="72" cy="68" r="8.5" fill="#3E9E63"/></g>
    <g transform="translate(40 64)">
      <rect x="-3" y="0" width="6" height="17" rx="1" fill="#69748E"/>
      <g transform="skewX(-14)">
        <rect x="-29" y="-23" width="57" height="26" rx="2" fill="#2B4C86"/>
        <g stroke="#7FA8DC" stroke-width="1.5">
          <path d="M-10 -23 v26"/><path d="M9 -23 v26"/><path d="M-29 -13 h57"/>
        </g>
      </g>
    </g>
  </symbol>

</defs></svg>
